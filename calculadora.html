<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="src/style/style.css">
  <link rel="stylesheet" href="src/style/header.css">
  <title>Precifica+ — Calculadora</title>
</head>
<body>
<header class="hero compacto">
  <a href="index.html" class="logo"><img src="src/image/logo.png" alt="Precifica+ — Seu produto tem valor."></a><a class="voltar" href="index.html"><i class="fa-solid fa-arrow-left"></i> Início</a>
</header>
<main class="pagina calc">
  <form id="form" class="painel painel-form" novalidate>
    <h1>Cálculo de precificação</h1>
    <label for="categoria">Qual produto você vai vender?</label>
    <select id="categoria" required>
      <option value="">Selecione</option>
      <option value="doces">Doces e bolos</option>
      <option value="salgados">Salgados</option>
      <option value="marmitas">Marmitas</option>
      <option value="bijuterias">Bijuterias</option>
    </select>
    <p id="dica" class="dica" hidden></p>
    <button type="button" id="exemplo" class="link" hidden>Preencher com o exemplo</button>

    <div class="grade">
      <div><label for="ing" id="l-ing">Ingredientes (R$)</label><input id="ing" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
      <div><label for="desp">Despesas: gás, água, energia (R$)</label><input id="desp" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
      <div><label for="mao">Mão de obra (R$)</label><input id="mao" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
      <div><label for="emb">Embalagem (R$)</label><input id="emb" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></div>
      <div><label for="un" id="l-un">Unidades produzidas</label><input id="un" type="number" step="1" min="1" inputmode="numeric" placeholder="1"></div>
      <div><label for="margem">Margem de lucro (%)</label><input id="margem" type="number" step="1" min="0" max="99" inputmode="decimal" placeholder="40"></div>
    </div>
    <label for="ref">Preço de referência no mercado, por unidade (R$) — opcional</label>
    <input id="ref" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00">
    <p class="formula">Preço = custo por unidade ÷ (1 − margem)</p>
    <p id="erro" class="erro" role="alert" hidden></p>
    <button type="submit" id="calculate">Calcular preço</button>
  </form>

  <section class="painel painel-res" aria-live="polite" id="resultado">
    <p class="vazio">Escolha o produto, informe os custos do lote e calcule. O preço sugerido aparece aqui.</p>
  </section>
</main>
<footer class="rodape"><p><strong>Organizado por:</strong> Henrique Avelar • Isaque Ferreira • Ivy Gabrielle • Julia Nobrega • Kelvin Silva • Lucas Macedo • Maria Clara dos Santos</p></footer>
<script src="src/javascript/script.js"></script>
</body>
</html>
